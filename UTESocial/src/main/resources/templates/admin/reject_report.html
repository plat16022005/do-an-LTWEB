<!DOCTYPE html>
<html lang="vi" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Từ chối Khiếu nại - AloUTE Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
	    :root {
	            --bg-dark: #0f172a;
	            --card-bg: #1e293b;
	            --sidebar-bg: #1e293b;
	            --border-color: #334155;
	            --text-light: #e2e8f0;
	            --text-muted: #94a3b8;
	            --primary-color: #0ea5e9;
	            --shadow-medium: rgba(0, 0, 0, 0.4);
	        }
	        body {
	            font-family: 'Open Sans', sans-serif;
	            background-color: var(--bg-dark);
	            color: var(--text-light);
	            display: flex;
	            min-height: 100vh;
	            margin: 0;
	            padding: 0;
	        }
	        h1, h2, h3, h4, h5, h6 {
	            font-family: 'Montserrat', sans-serif;
	        }
	        ::-webkit-scrollbar {
	            width: 8px;
	        }
	        ::-webkit-scrollbar-track {
	            background: var(--bg-dark);
	        }
	        ::-webkit-scrollbar-thumb {
	            background: var(--border-color);
	            border-radius: 4px;
	        }
	        ::-webkit-scrollbar-thumb:hover {
	            background: #475569;
	        }
	        .main-wrapper {
	            display: flex;
	            width: 100%;
	            padding: 20px;
	            gap: 20px;
	        }
	        .sidebar-container {
	            flex-shrink: 0;
	            width: 280px;
	            position: sticky;
	            top: 20px;
	            height: calc(100vh - 40px);
	        }
	        .sidebar {
	            background-color: var(--sidebar-bg);
	            border-radius: 15px;
	            padding: 20px 0;
	            box-shadow: 0 10px 30px var(--shadow-medium);
	            border: 1px solid var(--border-color);
	            height: 100%;
	            overflow-y: auto;
	        }
	        .sidebar .navbar-brand {
	            padding: 10px 20px;
	            color: var(--primary-color);
	            border-bottom: 1px solid var(--border-color);
	            margin-bottom: 20px;
	            display: block;
	            text-align: center;
	        }
	        .sidebar .nav-link {
	            color: var(--text-muted);
	            padding: 12px 25px;
	            display: flex;
	            align-items: center;
	            gap: 15px;
	            transition: background-color 0.2s, color 0.2s, transform 0.3s ease;
	        }
	        .sidebar .nav-link:hover, .sidebar .nav-link.active {
	            background-color: rgba(14, 165, 233, 0.1);
	            color: var(--text-light);
	            border-left: 4px solid var(--primary-color);
	            padding-left: 21px;
	            transform: translateX(5px);
	        }
	        .sidebar .nav-link.active {
	            font-weight: bold;
	        }
	        .main-content {
	            flex-grow: 1;
	            display: flex;
	            flex-direction: column;
	            gap: 20px;
	        }
	        .main-header {
	            background-color: var(--card-bg);
	            border-radius: 15px;
	            padding: 20px 30px;
	            box-shadow: 0 10px 30px var(--shadow-medium);
	            border: 1px solid var(--border-color);
	            display: flex;
	            justify-content: space-between;
	            align-items: center;
	            flex-wrap: wrap;
	            gap: 15px;
	        }
	        .main-header .form-control {
	            background-color: var(--bg-dark);
	            border-color: var(--border-color);
	            color: var(--text-light);
	            max-width: 300px;
	            border-radius: 50rem;
	        }
	        .main-header .form-control::placeholder {
	            color: var(--text-muted);
	        }
	        .main-header .input-group {
	            flex-grow: 1;
	            max-width: 400px;
	        }
	        .main-header .search-icon {
	            color: var(--text-muted);
	            font-size: 1.25rem;
	        }
	        .main-header .profile-avatar {
	            width: 40px;
	            height: 40px;
	            border-radius: 50%;
	            object-fit: cover;
	            border: 2px solid var(--primary-color);
	        }
	        .content-card {
	            background-color: var(--card-bg);
	            border-radius: 15px;
	            padding: 25px;
	            box-shadow: 0 8px 25px var(--shadow-medium);
	            border: 1px solid var(--border-color);
	            transition: transform 0.3s ease, box-shadow 0.3s ease;
	        }
	        .content-card:hover {
	            transform: translateY(-5px);
	            box-shadow: 0 15px 40px var(--shadow-medium);
	        }
	        .bi {
	            font-size: 1.25rem;
	            width: 25px;
	            text-align: center;
	        }
	        .nav-link.active .bi {
	            color: var(--primary-color);
	        }
	        .nav-link .bi {
	            color: var(--text-muted);
	        }
	        .table {
	            color: var(--text-light);
	            background-color: transparent;
	            border-radius: 15px;
	            overflow: hidden;
	        }
	        .table thead th {
	            border-bottom: 1px solid var(--border-color);
	            color: var(--text-muted);
	        }
	        .table tbody tr:last-child td {
	            border-bottom: none;
	        }
	        .table tbody td {
	            border-top: 1px solid var(--border-color);
	        }
	        .form-select-sm {
	            background-color: var(--bg-dark);
	            border-color: var(--border-color);
	            color: var(--text-light);
	            border-radius: 8px;
	        }
	        .form-select-sm:focus {
	            border-color: var(--primary-color);
	            box-shadow: 0 0 0 0.25rem rgba(14, 165, 233, 0.25);
	        }
	        @media (max-width: 992px) {
	            .main-wrapper {
	                flex-direction: column;
	            }
	            .sidebar-container {
	                width: 100%;
	                margin-right: 0;
	                margin-bottom: 20px;
	                position: static;
	            }
	            .sidebar {
	                height: auto;
	            }
	            .main-content {
	                margin-left: 0;
	            }
	            .main-header {
	                flex-direction: column;
	                align-items: flex-start;
	            }
	            .main-header .input-group {
	                width: 100%;
	                max-width: none;
	            }
	        }
    </style>
</head>
<body>
    <div class="main-wrapper">
        <div class="sidebar-container">
             <div class="sidebar">
                  <a class="navbar-brand ..." th:href="@{/admin/dashboard}">... AloUTE Admin</a>
                 <ul class="nav flex-column mt-4">
                     <li class="nav-item"><a class="nav-link" th:href="@{/admin/dashboard}">... Dashboard</a></li>
                     <li class="nav-item"><a class="nav-link" th:href="@{/admin/users}">... Quản lý Người dùng</a></li>
                     <li class="nav-item"><a class="nav-link" th:href="@{/admin/posts}">... Quản lý Bài đăng</a></li>
                     <li class="nav-item"><a class="nav-link active" th:href="@{/admin/reports}">... Khiếu nại</a></li>
                     <li class="nav-item"><a class="nav-link" th:href="@{/logout}">... Đăng xuất</a></li>
                 </ul>
             </div>
         </div>
         <div class="main-content">
            <div class="main-header">
                 <div>
                     <h2 class="mb-0">Từ chối Khiếu nại</h2>
                     <p class="text-muted mb-0">Nhập lý do từ chối cho khiếu nại ID: <span th:text="${reportId}"></span></p>
                 </div>
                  <div class="d-flex align-items-center gap-3">
                     <img src="https://placehold.co/40x40/0ea5e9/FFFFFF?text=A" alt="Admin Avatar" class="profile-avatar">
                 </div>
             </div>
             <div class="content-card">
                 <div class="mb-4 p-3 border border-secondary rounded" th:if="${reportSummary != null}">
                     <p><strong>Người tố cáo:</strong> <span th:text="${reportSummary.reporterName}"></span></p>
                     <p><strong>Đối tượng:</strong> <span th:text="${reportSummary.targetInfo}"></span></p>
                     <p><strong>Lý do gốc:</strong> <span th:text="${reportSummary.originalReason}"></span></p>
                 </div>

                 <form th:action="@{/admin/reports/reject}" method="post">
                     <input type="hidden" name="reportId" th:value="${reportId}" />
                     <div class="mb-3">
                         <label for="rejectReason" class="form-label">Lý do từ chối <span class="text-danger">*</span></label>
                         <textarea class="form-control" id="rejectReason" name="rejectReason" rows="4" required placeholder="Ví dụ: Không đủ bằng chứng, không vi phạm quy định..."></textarea>
                     </div>
                     <button type="submit" class="btn btn-danger"><i class="bi bi-x-circle-fill me-2"></i>Xác nhận Từ chối</button>
                     <a th:href="@{/admin/reports}" class="btn btn-secondary"><i class="bi bi-arrow-left-circle me-2"></i>Hủy</a>
                 </form>
             </div>
             </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
