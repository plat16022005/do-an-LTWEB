<script>
document.addEventListener('DOMContentLoaded', () => {
	  const avatarInput = document.getElementById('avatar-input');
	  const backgroundInput = document.getElementById('background-input');

	  const avatarPreview = document.getElementById('avatar-preview');
	  const avatarPreviewDisplay = document.getElementById('avatar-preview-display');

	  const backgroundPreview = document.getElementById('background-preview');
	  const coverPreviewDisplay = document.getElementById('cover-preview-display');

	  // Cập nhật ảnh đại diện
	  avatarInput.addEventListener('change', (e) => {
	    const file = e.target.files[0];
	    if (file) {
	      const url = URL.createObjectURL(file);
	      avatarPreview.src = url;
	      avatarPreviewDisplay.src = url;
	    }
	  });

	  // Cập nhật ảnh bìa
	  backgroundInput.addEventListener('change', (e) => {
	    const file = e.target.files[0];
	    if (file) {
	      const url = URL.createObjectURL(file);
	      backgroundPreview.src = url;
	      coverPreviewDisplay.src = url;
	    }
	  });
	});

</script>
<script>
const fileInput = document.getElementById('background-input');
const avatarInput = document.getElementById('avatar-input'); // 👈 thêm input avatar
const preview = document.getElementById('background-preview');
const overlay = document.querySelector('.cover-frame-overlay');
const saveBtn = document.getElementById('save-cover-btn');

let imageFile = null;
let croppedBlob = null; // 👈 giữ blob sau khi crop
let isDragging = false;
let startY = 0;
let startTop = 0;

// 🖼 Upload ảnh bìa
fileInput.addEventListener('change', (e) => {
  imageFile = e.target.files[0];
  if (imageFile) {
    const url = URL.createObjectURL(imageFile);
    preview.src = url;
  }
});

// 🧭 Kéo khung chọn vùng
overlay.addEventListener('mousedown', (e) => {
  isDragging = true;
  startY = e.clientY;
  startTop = overlay.offsetTop;
});
document.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  const deltaY = e.clientY - startY;
  let newTop = startTop + deltaY;

  const overlayHeight = overlay.offsetHeight;
  const imgHeight = preview.offsetHeight;

  if (newTop < 0) newTop = 0;
  if (newTop + overlayHeight > imgHeight) newTop = imgHeight - overlayHeight;

  overlay.style.top = `${newTop}px`;
  overlay.style.transform = 'translateX(-50%)';
});
document.addEventListener('mouseup', () => {
  isDragging = false;
});

// ✂️ Xử lý crop ảnh bìa thành Blob
function cropCover(callback) {
  if (!imageFile) {
    callback(null);
    return;
  }

  const img = new Image();
  img.src = URL.createObjectURL(imageFile);

  img.onload = () => {
    const scale = img.naturalWidth / preview.clientWidth;
    const cropTop = overlay.offsetTop * scale;
    const cropHeight = overlay.offsetHeight * scale;
    const cropWidth = img.naturalWidth;

    const canvas = document.createElement('canvas');
    canvas.width = cropWidth;
    canvas.height = cropHeight;
    const ctx = canvas.getContext('2d');

    ctx.drawImage(
      img,
      0, cropTop, cropWidth, cropHeight,
      0, 0, cropWidth, cropHeight
    );

    canvas.toBlob((blob) => {
      croppedBlob = blob;
      callback(blob);
    }, "image/jpeg");
  };
}

// 📨 Khi bấm nút Lưu
saveBtn.addEventListener('click', (e) => {
  e.preventDefault();

  cropCover((coverBlob) => {
    const formData = new FormData();

    // 🟡 Thêm ảnh đại diện nếu có
    if (avatarInput.files[0]) {
      formData.append("avatar", avatarInput.files[0]);
    }

    // 🟡 Thêm ảnh bìa đã crop nếu có
    if (coverBlob) {
      formData.append("cover", coverBlob, "cover.jpg");
    }

    fetch("/setting/images", { // 👈 dùng 1 API xử lý cả 2 ảnh
      method: "POST",
      body: formData
    })
    .then(res => res.text())
    .then(msg => {

      // 🔁 Redirect về trang cá nhân
      const username = document.body.dataset.username;
      window.location.href = "/profile";
    })
    .catch(err => {
      console.error(err);
      alert("Lỗi khi cập nhật ảnh ❌");
    });
  });
});

</script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  const hash = window.location.hash;
  if (hash) {
    const tabTrigger = document.querySelector(`a[href="${hash}"]`);
    if (tabTrigger) {
      const tab = new bootstrap.Tab(tabTrigger);
      tab.show();
    }

    // 🧽 Ẩn hash sau khi đã kích hoạt tab
    history.replaceState(null, null, window.location.pathname);
  }
});
</script>
