<!DOCTYPE html>
<html lang="vi" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">

    <!-- Bootstrap CSS -->

      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->

      rel="stylesheet"

    <!-- Link to external stylesheet -->
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <style>
      /* Thêm style cho phần xem trước avatar */
      .avatar-preview-container {
        width: 120px;
        height: 120px;
        border: 2px dashed #334155;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden; /* Ensure image fits */
      }
      .light-theme .avatar-preview-container {
        border-color: #cbd5e1;
      }
      .avatar-preview-container img {
        width: 100%;
        height: 100%;
        object-fit: cover; /* Cover the container */
      }
      .avatar-preview-container .icon-placeholder {
        font-size: 3rem;
        color: #64748b;
      }
      .light-theme .avatar-preview-container .icon-placeholder {
        color: #94a3b8;
      }

      /* Thêm style cho phần xem trước ảnh bìa */
      .cover-preview-container {
        width: 100%;
        height: 200px; /* Adjust height as needed */
        border: 2px dashed #334155;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
        border-radius: 0.5rem; /* Match card rounding */
      }
      .light-theme .cover-preview-container {
        border-color: #cbd5e1;
      }
      .cover-preview-container img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .cover-preview-container .icon-placeholder {
        font-size: 3rem;
        color: #64748b;
      }
      .light-theme .cover-preview-container .icon-placeholder {
        color: #94a3b8;
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/theme-toggle.js}"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const avatarInput = document.getElementById("groupAvatarInput");
        const avatarPreview = document.getElementById("avatarPreview");
        const avatarPlaceholder = document.getElementById("avatarPlaceholder");
        const coverInput = document.getElementById("groupCoverInput");
        const coverPreview = document.getElementById("coverPreview");
        const coverPlaceholder = document.getElementById("coverPlaceholder");

        function handleImagePreview(
          inputElement,
          previewElement,
          placeholderElement
        ) {
          const file = inputElement.files[0];
          if (file && file.type.startsWith("image/")) {
            const reader = new FileReader();
            reader.onload = function (e) {
              previewElement.src = e.target.result;
              previewElement.style.display = "block";
              if (placeholderElement) placeholderElement.style.display = "none";
            };
            reader.readAsDataURL(file);
          } else {
            previewElement.src = "#";
            previewElement.style.display = "none";
            if (placeholderElement) placeholderElement.style.display = "block";
            if (file) {
              // Only alert if a file was selected but wasn't an image
              alert("Vui lòng chọn một tệp ảnh.");
            }
            inputElement.value = ""; // Reset input if file is invalid
          }
        }

        avatarInput.addEventListener("change", function () {
          handleImagePreview(avatarInput, avatarPreview, avatarPlaceholder);
        });

        coverInput.addEventListener("change", function () {
          handleImagePreview(coverInput, coverPreview, coverPlaceholder);
        });
      });
    </script>
