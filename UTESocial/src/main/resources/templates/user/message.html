    <style>
        /* === THAY BẰNG TOÀN BỘ ĐOẠN NÀY === */

        /* 1. Thiết lập vùng chứa:
           - Dùng 'flex' để các item xếp hàng ngang.
           - Dùng 'wrap' để tự động xuống hàng khi hết chỗ.
           - Dùng 'gap' để tạo khoảng cách đẹp mắt.
        */
        .message .attachment-scroll {
            display: flex;
            flex-wrap: wrap;    /* Đây là mấu chốt để tự động xuống hàng */
            gap: 8px;           /* Khoảng cách giữa các tệp */
            padding-top: 5px;
            
            /* Bỏ các thuộc tính cuộn ngang cũ */
            overflow-x: hidden; 
            padding-bottom: 0;
        }

        /* 2. Thiết lập kích thước CỤ THỂ cho TỪNG tệp đính kèm.
           Bạn có thể thay đổi 100px thành kích thước bạn muốn.
        */
        .message .attachment-scroll .attachment-item img,
        .message .attachment-scroll .attachment-item video,
        .message .attachment-scroll .attachment-item .bg-dark-subtle {
            
            width: 100px !important;  /* Độ rộng CỤ THỂ */
            height: 100px !important; /* Độ cao CỤ THỂ */
            
            /* Đảm bảo ảnh/video không bị méo, mà sẽ fill vừa khung */
            object-fit: cover;
            
            /* Ghi đè các style inline cũ từ JS */
            max-width: none !important;
            max-height: none !important;
            border-radius: 8px;
        }

        /* 3. Style riêng cho các tệp (không phải ảnh/video) 
           để chúng cũng có kích thước 100x100
        */
        .message .attachment-scroll .attachment-item .bg-dark-subtle {
            /* Đảm bảo nội dung file (icon, link) được căn giữa */
            display: flex !important;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden; /* Ẩn chữ nếu quá dài */
            padding: 5px !important; /* Ghi đè padding cũ */
        }

        /* 4. Tinh chỉnh link file cho gọn */
        .message .attachment-scroll .attachment-item .bg-dark-subtle a {
            font-size: 0.8rem;
            word-break: break-all; /* Ngắt chữ nếu tên file quá dài */
        }

        /* 5. Gỡ bỏ lề phải 'me-2' mà JS đang thêm vào 
           để dùng 'gap' cho đồng bộ
        */
        .message .attachment-scroll .attachment-item {
            margin-right: 0 !important;
        }

        /* === HẾT === */
    </style>

<script>
let currentChatFriendId = null;

async function openChatWith(element) {
    const friendId = element.getAttribute('data-peer-id');
    const friendName = element.querySelector('.name').innerText;
    const friendAvatar = element.querySelector('img').src;
    const friendUsername = element.getAttribute('data-username');
    currentChatFriendId = friendId;

    // 🧭 Cập nhật chat header
    document.getElementById('chat-header-avatar').src = friendAvatar;
    document.getElementById('chat-header-name').innerText = friendName;
    const usernameLink = document.getElementById('chat-header-nameUser');
    usernameLink.innerText = friendUsername;
    usernameLink.href = '/' + friendUsername;

    // 📨 Gọi API lấy tin nhắn
    const res = await fetch(`/message/load/${friendId}`);
    const messages = await res.json();

    const chatBody = document.getElementById('chat-body');
    chatBody.innerHTML = '';

    if (messages.length === 0) {
        chatBody.innerHTML = `<div class="text-center text-muted mt-4">Chưa có tin nhắn nào, hãy bắt đầu trò chuyện 💬</div>`;
        return;
    }

    messages.forEach(msg => renderMessage(msg));
    chatBody.scrollTop = chatBody.scrollHeight;
}
document.addEventListener('DOMContentLoaded', () => {
    const autoFriendId = document.getElementById('auto-open-friend-id')?.value;
    if (autoFriendId) {
        // tìm đúng phần tử cuộc trò chuyện tương ứng với friendId
        const element = document.querySelector(`.conversation-item[data-peer-id="${autoFriendId}"]`);
        if (element) {
            openChatWith(element);
        } else {
            console.warn("⚠ Không tìm thấy friendId để auto open chat:", autoFriendId);
        }
    }
});

function renderMessage(msg) {
    const sentByMe = msg.sender.userId == USER_ID;
    const row = document.createElement('div');
    row.classList.add('chat-row');
    if (sentByMe) row.classList.add('sent');

    const avatarUrl = msg.sender.avatarUrl || 'https://placehold.co/36x36?text=U';

    let messageContent = `
        ${!sentByMe ? `<img src="${avatarUrl}" class="rounded-circle avatar-chat" alt="${msg.sender.fullName}">` : ''}
        <div class="message ${sentByMe ? 'message-sent' : 'message-received'}">
            ${!sentByMe ? `<small class="d-block text-muted sender-name">${msg.sender.fullName}:</small>` : ''}
            ${msg.content || ''}
    `;

    // ✅ Hiển thị attachments có thanh trượt ngang
    if (msg.attachments && msg.attachments.length > 0) {
    	messageContent += `<div class="attachment-scroll mt-2">`;

        msg.attachments.forEach(att => {
        	const fileUrl = att.fileUrl ?? att.fileURL ?? att.url ?? '';
        	if (!fileUrl) return;
            // 👉 Chuyển URL tương đối thành tuyệt đối
            const absoluteUrl = new URL(fileUrl, window.location.origin).href;

            let fileType = att.fileType ? att.fileType.toLowerCase() : '';
            if (fileType === 'video' || absoluteUrl.endsWith('.mp4')) {
                fileType = 'video/mp4'; // fallback MIME chuẩn
            }

            // 👀 In ra console để kiểm tra
            console.log("📎 Attachment URL:", absoluteUrl);
            console.log("📄 Attachment Type:", fileType);

            if (fileType.startsWith('image')) {
                // 🖼 Ảnh (ĐÃ CẬP NHẬT)
                messageContent += `
                    <div class="attachment-item me-2">
                        <img src="${absoluteUrl}" 
                             class="img-fluid rounded" 
                             style="max-width: 200px; max-height: 200px; object-fit: cover; cursor: pointer;"
                             onclick="showImageModal('${absoluteUrl}')">
                    </div>
                `;
            } else if (fileType.startsWith('video')) {
                // 📹 Video
                messageContent += `
                    <div class="attachment-item me-2">
                        <video controls playsinline preload="metadata" style="max-width: 250px; max-height: 250px; border-radius: 8px;">
                            <source src="${absoluteUrl}" type="${fileType}">
                            Trình duyệt của bạn không hỗ trợ video.
                        </video>
                    </div>
                `;
            } else if (fileType.includes('pdf')) {
                // 📄 PDF
                messageContent += `
                    <div class="attachment-item me-2 p-2 border rounded bg-dark-subtle d-flex align-items-center">
                        <i class="bi bi-file-earmark-pdf-fill fs-2 text-danger me-2"></i>
                        <a href="${absoluteUrl}" target="_blank" class="text-primary small">Tải PDF</a>
                    </div>
                `;
            } else {
                // 📎 File khác
                const fileName = absoluteUrl.split('/').pop();
                messageContent += `
                    <div class="attachment-item me-2 p-2 border rounded bg-dark-subtle d-flex align-items-center">
                        <i class="bi bi-paperclip fs-2 me-2"></i>
                        <a href="${absoluteUrl}" target="_blank" class="text-primary small">${fileName}</a>
                    </div>
                `;
            }
        });

        messageContent += `</div>`;
    }

    row.innerHTML = messageContent;
    document.getElementById('chat-body').appendChild(row);
}

//... ngay bên dưới hàm renderMessage(msg) { ... }

function updateConversationPreview(msg) {
    // Đảm bảo msg.sender và msg.receiver tồn tại
    if (!msg.sender || !msg.receiver) {
        console.warn("Bỏ qua update preview vì thiếu sender/receiver", msg);
        return;
    }
    
    const senderId = msg.sender.userId;
    const receiverId = msg.receiver.userId;
    const sentByMe = String(senderId) === USER_ID;

    // ID của người bạn (người ở đầu bên kia)
    const friendId = sentByMe ? String(receiverId) : String(senderId);

    // 1. Tìm đúng item trong danh sách
    const conversationElement = document.querySelector(`.conversation-item[data-peer-id="${friendId}"]`);
    if (!conversationElement) return; // Không tìm thấy

    // 2. Tìm phần tử span để update
    const previewSpan = conversationElement.querySelector('.message-preview span');
    if (!previewSpan) return;

    // 3. Quyết định nội dung preview (chỉ nội dung tin nhắn)
    let previewContent = msg.content; // Lấy nội dung text

    if (!previewContent && msg.attachments && msg.attachments.length > 0) {
        // Nếu không có text, nhưng có attachment, hiển thị thông báo chung
        const firstAtt = msg.attachments[0];
        let fileType = firstAtt.fileType ? firstAtt.fileType.toLowerCase() : '';
        
        if (fileType.startsWith('image')) previewContent = "🖼️ [Hình ảnh]";
        else if (fileType.startsWith('video')) previewContent = "📹 [Video]";
        else previewContent = "📎 [Tệp đính kèm]";
        
    } else if (!previewContent) {
        previewContent = "..."; // Fallback nếu tin nhắn rỗng
    }
    
    // 4. ⭐ NÂNG CẤP: Thêm tên người gửi hoặc "Bạn:"
    let fullPreviewText = "";
    if (sentByMe) {
        // Nếu là mình gửi
        fullPreviewText = "Bạn: " + previewContent;
    } else {
        // Nếu là người khác gửi (Yêu cầu mới)
        const senderName = msg.sender.fullName || "Người gửi"; // Lấy tên người gửi
        fullPreviewText = senderName + ": " + previewContent;
    }

    // 5. Cập nhật nội dung
    previewSpan.textContent = fullPreviewText;
}
function showImageModal(imageUrl) {
    // 1. Tìm thẻ <img> bên trong modal
    const modalImage = document.getElementById('modalImage');
    
    // 2. Gán đường dẫn ảnh cho nó
    modalImage.src = imageUrl;
    
    // 3. Lấy thực thể (instance) của modal và hiển thị
    // (Chúng ta dùng 'new' mỗi lần để đảm bảo nó luôn hoạt động
    //  kể cả khi modal bị ẩn/hiện nhiều lần)
    const modal = new bootstrap.Modal(document.getElementById('imageModal'));
    modal.show();
}
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>


<script>
    let stompClient = null;

    function connectWebSocket() {
        const socket = new SockJS('/ws');
        stompClient = Stomp.over(socket);

        stompClient.connect({}, (frame) => {
            console.log('✅ Kết nối WS thành công:', frame);

            // đăng ký nhận tin nhắn realtime cho user hiện tại
         // đăng ký nhận tin nhắn realtime cho user hiện tại
            stompClient.subscribe('/topic/messages/' + USER_ID, (message) => {
                const msg = JSON.parse(message.body);
                console.log("📩 Nhận tin nhắn websocket:", msg);

                // ⭐ BƯỚC 3: LUÔN CẬP NHẬT PREVIEW KHI NHẬN
                // (Hàm này sẽ tự kiểm tra xem tin nhắn là của mình hay của bạn)
                updateConversationPreview(msg);

                // --- Logic cũ của bạn để hiển thị tin nhắn trong khung chat ---
                let isCurrentChat = false;
                if(msg.sender && msg.receiver) {
                    isCurrentChat = (String(msg.sender.userId) === String(currentChatFriendId)) || 
                                    (String(msg.receiver.userId) === String(currentChatFriendId));
                } else if (msg.senderId && msg.receiverId) {
                     isCurrentChat = (String(msg.senderId) === String(currentChatFriendId)) || 
                                    (String(msg.receiverId) === String(currentChatFriendId));
                }
                
                if (isCurrentChat) {
                    let senderId = msg.sender ? msg.sender.userId : msg.senderId; 
                    if (String(senderId) !== USER_ID) {
                         console.log("✅ Hiển thị tin nhắn từ người khác");
                         renderMessage(msg);
                    } else {
                        console.log("ℹ️ Bỏ qua tin nhắn của chính mình (vì đã render bởi fetch)");
                    }
                } else {
                    console.log("ℹ️ Không hiển thị tin nhắn vì không phải chat hiện tại");
                }
            });

        });
    }

    async function sendMessage() {
        if (!stompClient || !stompClient.connected) {
            console.warn('⚠️ WebSocket chưa kết nối');
            // Bạn vẫn có thể cho gửi qua fetch, nhưng nên log lỗi
            // return; // Không nên return, cứ để fetch chạy
        }

        const input = document.querySelector('#chat-input');
        const content = input.value.trim();
        // (Kiểm tra file đính kèm)
        const hasFiles = window.pendingAttachments && window.pendingAttachments.length > 0;
        
        if (content === '' && !hasFiles || !currentChatFriendId) return;

        // 📨 Gửi về API backend để lưu DB + tạo DTO
        const formData = new FormData();
        formData.append('content', content);
        formData.append('receiverId', currentChatFriendId);

        if (hasFiles) {
            window.pendingAttachments.forEach(file => formData.append('attachments', file));
        }

        const res = await fetch('/message/send', {
            method: 'POST',
            body: formData
        });

        const savedMsg = await res.json();

        // ✅ Render tin nhắn mình gửi ngay lập tức
        renderMessage(savedMsg);
        
        // ⭐ BƯỚC 2: CẬP NHẬT PREVIEW KHI GỬI
        updateConversationPreview(savedMsg);

        // reset input
        input.value = '';
        window.pendingAttachments = [];
        
        renderFilePreviews();
    }

    // ⭐⭐⭐ GỌI HÀM KẾT NỐI Ở ĐÂY ⭐⭐⭐
    connectWebSocket();
    function renderFilePreviews() {
        const previewContainer = document.getElementById('file-preview-container');
        previewContainer.innerHTML = ''; // Xóa preview cũ

        if (!window.pendingAttachments || window.pendingAttachments.length === 0) {
            previewContainer.classList.add('d-none'); // Ẩn container nếu không có file
            return;
        }

        previewContainer.classList.remove('d-none'); // Hiển thị container

        window.pendingAttachments.forEach((file, index) => {
            const previewWrapper = document.createElement('div');
            previewWrapper.className = 'file-preview-item position-relative';
            previewWrapper.title = file.name; // Hiển thị tên file khi hover
            
            // Nút xóa file (chữ X nhỏ)
            const removeBtn = document.createElement('button');
            removeBtn.className = 'btn btn-danger btn-sm rounded-circle position-absolute top-0 end-0 m-1';
            removeBtn.innerHTML = '<i class="bi bi-x" style="font-size: 0.8rem;"></i>';
            removeBtn.style = 'width: 20px; height: 20px; line-height: 1; padding: 0; z-index: 10;';
            removeBtn.onclick = () => removePendingFile(index);

            if (file.type.startsWith('image/')) {
                // Preview cho ảnh
                const reader = new FileReader();
                reader.onload = (e) => {
                    previewWrapper.innerHTML = `<img src="${e.target.result}" style="height: 70px; width: 70px; object-fit: cover; border-radius: 5px;">`;
                    previewWrapper.appendChild(removeBtn);
                };
                reader.readAsDataURL(file);
            } else {
                // Preview cho file khác (hiện icon và tên)
                let icon = 'bi-file-earmark'; // Icon mặc định
                if (file.type.startsWith('video/')) icon = 'bi-file-earmark-play';
                if (file.type.includes('pdf')) icon = 'bi-file-earmark-pdf';

                previewWrapper.innerHTML = `
                    <div class="d-flex flex-column align-items-center justify-content-center bg-body-tertiary rounded" 
                         style="height: 70px; width: 70px; text-align: center; padding: 5px; overflow: hidden; border: 1px solid var(--bs-border-color);">
                        <i class="bi ${icon}" style="font-size: 2rem;"></i>
                        <small class="text-truncate" style="max-width: 65px;">${file.name}</small>
                    </div>
                `;
                previewWrapper.appendChild(removeBtn);
            }
            
            previewContainer.appendChild(previewWrapper);
        });
    }

    /**
     * Xóa một file khỏi danh sách chờ (pendingAttachments)
     */
    function removePendingFile(indexToRemove) {
        // Lọc ra file bị xóa
        window.pendingAttachments = window.pendingAttachments.filter((_, index) => index !== indexToRemove);
        // Render lại danh sách preview
        renderFilePreviews();
    }
</script>
