    <style>

    </style>

<body class="text-light">

    <nav class="navbar sticky-top">

            <a class="navbar-brand fw-bold fs-4 d-flex align-items-center" th:href="@{/home}">

    <div class="container-xl mt-4">
        <div class="row g-4">
            <!-- Sidebar -->
            <div class="col-lg-3 d-none d-lg-block">
				<aside class="sticky-top" style="top: 80px;">
				    <ul class="nav flex-column gap-1">
						<li class="nav-item">
				            <a class="nav-link rounded-pill fs-5 fw-bold d-flex align-items-center gap-3 p-2" href="/home">
				                <i class="bi bi-house-door-fill fs-3"></i>
				                <span>Trang chủ</span>
				            </a>
				        </li>
				        <li class="nav-item">
				            <a class="nav-link rounded-pill fs-5 fw-bold d-flex align-items-center gap-3 p-2" href="/upload">
				                <i class="bi bi-upload fs-3"></i>
				                <span>Đăng tải</span>
				            </a>
				        </li>
				        <li class="nav-item">
				            <a class="nav-link rounded-pill fs-5 fw-bold d-flex align-items-center gap-3 p-2" href="/search">
				                <i class="bi bi-search fs-3"></i>
				                <span>Tìm kiếm</span>
				            </a>
				        </li>
				        <li class="nav-item">
				            <a class="nav-link rounded-pill fs-5 fw-bold d-flex align-items-center gap-3 p-2" href="/friend">
				                <i class="bi bi-people fs-3"></i>
				                <span>Bạn bè</span>
				            </a>
				        </li>
				        <li class="nav-item">
						  <a class="nav-link rounded-pill fs-5 fw-bold d-flex align-items-center gap-3 p-2" href="/group">
						      <i class="bi bi-globe2 fs-3"></i>
						      <span>Nhóm</span>
						  </a>
						</li>				       
				        <li class="nav-item">
				            <a class="nav-link active rounded-pill fs-5 fw-bold d-flex align-items-center gap-3 p-2" href="/message">
				                <i class="bi bi-envelope fs-3"></i>
				                <span>Tin nhắn</span>
				            </a>
				        </li>
				        <li class="nav-item">
				            <a class="nav-link rounded-pill fs-5 fw-bold d-flex align-items-center gap-3 p-2" href="/notification">
				                <i class="bi bi-bell fs-3"></i>
				                <span>Thông báo</span>
				            </a>
				        </li>
				        <li class="nav-item">
				            <a class="nav-link rounded-pill fs-5 fw-bold d-flex align-items-center gap-3 p-2" th:href="@{/{username}(username=${user.nameUser})}">
				                <i class="bi bi-person-circle fs-3"></i>
				                <span>Cá nhân</span>
				            </a>
				        </li>
				        <li class="nav-item">
				            <a class="nav-link rounded-pill fs-5 fw-bold d-flex align-items-center gap-3 p-2" href="/setting">
				                <i class="bi bi-gear fs-3"></i>
				                <span>Cài đặt</span>
				            </a>
				        </li>
				        <li class="nav-item mt-2">
				            <a class="nav-link text-danger rounded-pill fs-5 fw-bold d-flex align-items-center gap-3 p-2" href="/logout">
				                <i class="bi bi-box-arrow-right fs-3"></i>
				                <span>Đăng xuất</span>
				            </a>
				        </li>
				    </ul>
				</aside>
            </div>
            
            <!-- Chat main -->
            <div class="col-lg-9">
                <main>
                    <div class="card rounded-4 overflow-hidden">
                       <div class="chat-container">
                       		<input type="hidden" id="current-user-id" th:value="${user.userId}">
                           <!-- Danh sách cuộc trò chuyện -->
                           <div class="conversation-list">
                               <div class="p-3 border-bottom">
                                   <h4 class="mb-0">Tin nhắn</h4>
                               </div>
								<div class="list-group list-group-flush">
								    <div th:each="friend : ${friends}"
								         class="list-group-item list-group-item-action bg-transparent p-3 conversation-item"
								         th:attr="data-peer-id=${friend.userId},data-username=${friend.nameUser}"
								         onclick="openChatWith(this)">
								        <div class="d-flex align-items-start">
											<img th:src="${friend.avatarUrl != null ? friend.avatarUrl : 'https://placehold.co/48x48?text=U'}"
											     class="rounded-circle me-3"
											     style="width: 50px; height: 50px; object-fit: cover;"
											     alt="Avatar">

								            <div class="w-100 overflow-hidden">
								                <div class="d-flex justify-content-between">
								                    <h6 class="mb-1 fw-bold name" th:text="${friend.fullName}"></h6>
								                    <small class="text-muted time"></small>
								                </div>
												<p class="mb-0 small text-muted text-truncate message-preview">
												    <span th:text="${lastMessages[friend.userId]}"></span>
												</p>

								            </div>
								        </div>
								    </div>
								</div>

                           </div>

                           <!-- Cửa sổ chat chính -->
                           <div class="chat-window">
								<div class="chat-header p-3 d-flex align-items-center" id="chat-header">
								    <img id="chat-header-avatar" src="https://placehold.co/40x40?text=U" class="rounded-circle me-3" style="width: 50px; height: 50px; object-fit: cover;" alt="Avatar">
								    <div>
								        <h6 class="mb-0 fw-bold" id="chat-header-name">Chưa chọn cuộc trò chuyện</h6>
								        <a id="chat-header-nameUser" class="text-muted small text-decoration-none"></a>
								    </div>
								    <div class="ms-auto">
								        <button class="btn btn-outline-secondary rounded-circle ms-1">
								            <i class="bi bi-info-circle"></i>
								        </button>
								    </div>
								</div>
								
								<div class="chat-body" id="chat-body">
								    <div class="text-center text-muted mt-4">Hãy chọn 1 người bạn để bắt đầu trò chuyện 💬</div>
								</div>


                               <div class="chat-footer p-3">
                                   <div class="input-group">
                                       <button class="btn btn-outline-secondary"><i class="bi bi-paperclip"></i></button>
                                       <input type="text" class="form-control" placeholder="Nhập tin nhắn...">
                                       <button class="btn btn-primary"><i class="bi bi-send-fill"></i></button>
                                   </div>
                               </div>
                           </div>
                       </div>
                    </div>
                </main>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/theme-toggle.js}"></script>
<script>
	const USER_ID = document.getElementById('current-user-id').value;
</script>
<script>
let currentChatFriendId = null;

async function openChatWith(element) {
    const friendId = element.getAttribute('data-peer-id');
    const friendName = element.querySelector('.name').innerText;
    const friendAvatar = element.querySelector('img').src;
    const friendUsername = element.getAttribute('data-username');
    currentChatFriendId = friendId;

    // 🧭 Cập nhật chat header
    document.getElementById('chat-header-avatar').src = friendAvatar;
    document.getElementById('chat-header-name').innerText = friendName;
    const usernameLink = document.getElementById('chat-header-nameUser');
    usernameLink.innerText = friendUsername;
    usernameLink.href = '/' + friendUsername;

    // 📨 Gọi API lấy tin nhắn
    const res = await fetch(`/message/load/${friendId}`);
    const messages = await res.json();

    const chatBody = document.getElementById('chat-body');
    chatBody.innerHTML = '';

    if (messages.length === 0) {
        chatBody.innerHTML = `<div class="text-center text-muted mt-4">Chưa có tin nhắn nào, hãy bắt đầu trò chuyện 💬</div>`;
        return;
    }

    messages.forEach(msg => renderMessage(msg));
    chatBody.scrollTop = chatBody.scrollHeight;
}

function renderMessage(msg) {
    const sentByMe = msg.sender.userId == USER_ID;
    const row = document.createElement('div');
    row.classList.add('chat-row');
    if (sentByMe) row.classList.add('sent');

    const avatarUrl = msg.sender.avatarUrl || 'https://placehold.co/36x36?text=U';

    let messageContent = `
        ${!sentByMe ? `<img src="${avatarUrl}" class="rounded-circle avatar-chat" alt="${msg.sender.fullName}">` : ''}
        <div class="message ${sentByMe ? 'message-sent' : 'message-received'}">
            ${!sentByMe ? `<small class="d-block text-muted sender-name">${msg.sender.fullName}:</small>` : ''}
            ${msg.content || ''}
    `;

    // ✅ Hiển thị attachments có thanh trượt ngang
    if (msg.attachments && msg.attachments.length > 0) {
        messageContent += `<div class="attachment-scroll mt-2">`;

        msg.attachments.forEach(att => {
        	const fileUrl = att.fileUrl ?? att.fileURL ?? att.url ?? '';
        	if (!fileUrl) return;
            // 👉 Chuyển URL tương đối thành tuyệt đối
            const absoluteUrl = new URL(fileUrl, window.location.origin).href;

            let fileType = att.fileType ? att.fileType.toLowerCase() : '';
            if (fileType === 'video' || absoluteUrl.endsWith('.mp4')) {
                fileType = 'video/mp4'; // fallback MIME chuẩn
            }

            // 👀 In ra console để kiểm tra
            console.log("📎 Attachment URL:", absoluteUrl);
            console.log("📄 Attachment Type:", fileType);

            if (fileType.startsWith('image')) {
                // 🖼 Ảnh
                messageContent += `
                    <div class="attachment-item me-2">
                        <img src="${absoluteUrl}" class="img-fluid rounded" style="max-width: 200px; max-height: 200px; object-fit: cover;">
                    </div>
                `;
            } else if (fileType.startsWith('video')) {
                // 📹 Video
                messageContent += `
                    <div class="attachment-item me-2">
                        <video controls playsinline preload="metadata" style="max-width: 250px; max-height: 250px; border-radius: 8px;">
                            <source src="${absoluteUrl}" type="${fileType}">
                            Trình duyệt của bạn không hỗ trợ video.
                        </video>
                    </div>
                `;
            } else if (fileType.includes('pdf')) {
                // 📄 PDF
                messageContent += `
                    <div class="attachment-item me-2 p-2 border rounded bg-dark-subtle d-flex align-items-center">
                        <i class="bi bi-file-earmark-pdf-fill fs-2 text-danger me-2"></i>
                        <a href="${absoluteUrl}" target="_blank" class="text-primary small">Tải PDF</a>
                    </div>
                `;
            } else {
                // 📎 File khác
                const fileName = absoluteUrl.split('/').pop();
                messageContent += `
                    <div class="attachment-item me-2 p-2 border rounded bg-dark-subtle d-flex align-items-center">
                        <i class="bi bi-paperclip fs-2 me-2"></i>
                        <a href="${absoluteUrl}" target="_blank" class="text-primary small">${fileName}</a>
                    </div>
                `;
            }
        });

        messageContent += `</div>`;
    }

    row.innerHTML = messageContent;
    document.getElementById('chat-body').appendChild(row);
}

</script>

 <script>
document.querySelector('.chat-footer .btn-primary').addEventListener('click', async () => {
    const input = document.querySelector('.chat-footer input[type="text"]');
    const content = input.value.trim();
    if (!content && !window.pendingAttachments?.length) return;

    const formData = new FormData();
    formData.append('content', content);
    formData.append('receiverId', currentChatFriendId);

    // 🗂 Thêm file đính kèm nếu có
    if (window.pendingAttachments && window.pendingAttachments.length > 0) {
        window.pendingAttachments.forEach(file => formData.append('attachments', file));
    }

    const res = await fetch('/message/send', { method: 'POST', body: formData });
    const msg = await res.json();

    // ✅ Hiển thị ngay tin nhắn của bản thân
    renderMessage(msg);

    // Xoá input và reset file sau khi gửi
    input.value = '';
    window.pendingAttachments = [];
});
</script>
 <script>
document.querySelector('.chat-footer .btn-outline-secondary').addEventListener('click', () => {
    const input = document.createElement('input');
    input.type = 'file';
    input.multiple = true;
    input.onchange = (e) => {
        window.pendingAttachments = Array.from(e.target.files);
        console.log("📎 File đính kèm đã chọn:", window.pendingAttachments);
    };
    input.click();
});
</script>
 
</body>
</html>
